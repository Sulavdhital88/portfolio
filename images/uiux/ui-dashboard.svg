  <text x="605" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold">4.82%</text>
  <text x="605" y="155" fill="#9D50BB" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Top 5% sector</text>

  <rect x="210" y="190" width="360" height="280" rx="12" fill="#181E2C" stroke="rgba(255,255,255,0.06)"/>
  <text x="230" y="225" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold">Performance Trends</text>
  <text x="230" y="245" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Weekly engagement and traffic metrics</text>

  <path d="M230 420 Q280 340 330 360 T430 300 T530 270" fill="none" stroke="url(#limeGrad)" stroke-width="4" filter="url(#glow)"/>
  <path d="M230 420 Q280 340 330 360 T430 300 T530 270 L530 430 L230 430 Z" fill="rgba(0,245,160,0.06)"/>
  <circle cx="530" cy="270" r="6" fill="#00F5A0" stroke="#fff" stroke-width="2"/>

