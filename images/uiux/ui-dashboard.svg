  <rect x="0" y="48" width="180" height="452" fill="#111520"/>
  <line x1="180" y1="48" x2="180" y2="500" stroke="rgba(255,255,255,0.05)"/>
  <text x="30" y="90" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">⚡ NOVA UI</text>
  
  <rect x="15" y="115" width="150" height="36" rx="8" fill="rgba(0,245,160,0.12)"/>
  <text x="45" y="138" fill="#00F5A0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Dashboard</text>
  <circle cx="30" cy="133" r="4" fill="#00F5A0"/>

  <text x="45" y="180" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Analytics</text>
  <text x="45" y="220" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Transactions</text>
  <text x="45" y="260" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Customers</text>
  <text x="45" y="300" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Settings</text>

  <rect x="210" y="75" width="170" height="95" rx="12" fill="#181E2C" stroke="rgba(255,255,255,0.06)"/>
  <text x="225" y="100" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Total Revenue</text>
  <text x="225" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold">$48,920</text>
  <text x="225" y="155" fill="#00F5A0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">↑ +18.4% vs last mo</text>

  <rect x="400" y="75" width="170" height="95" rx="12" fill="#181E2C" stroke="rgba(255,255,255,0.06)"/>
  <text x="415" y="100" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Active Users</text>
  <text x="415" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold">14,280</text>
  <text x="415" y="155" fill="#00C6FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">↑ +12.1% growth</text>

  <rect x="590" y="75" width="185" height="95" rx="12" fill="#181E2C" stroke="rgba(255,255,255,0.06)"/>
