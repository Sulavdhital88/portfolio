    <text x="0" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold">$220.00</text>

    <text x="0" y="165" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">SELECT COLORWAY</text>
    <circle cx="15" cy="190" r="12" fill="#000" stroke="#00F5A0" stroke-width="2"/>
    <circle cx="50" cy="190" r="12" fill="#fff" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
