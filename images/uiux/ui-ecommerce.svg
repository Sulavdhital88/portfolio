      <stop offset="0%" stop-color="#111420"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="limeEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D084"/>
    </linearGradient>
    <filter id="sneakerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ecomBg)"/>
  <rect width="800" height="500" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <rect x="0" y="0" width="800" height="55" fill="#151926" rx="16"/>
  <text x="40" y="34" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold">KICKS<tspan fill="#00F5A0">LAB</tspan></text>
  <text x="200" y="34" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Drops</text>
  <text x="270" y="34" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Collections</text>
  <text x="370" y="34" fill="#8E9AA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Customs</text>
  <rect x="660" y="16" width="100" height="28" rx="14" fill="rgba(0,245,160,0.15)" stroke="#00F5A0" stroke-width="1"/>
