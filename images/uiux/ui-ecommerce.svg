  <path d="M140 310 C160 250 200 230 240 240 C280 200 320 190 380 210 C410 220 420 250 410 270 C420 280 430 300 420 320 L150 320 Z" fill="#1f2738" stroke="#00F5A0" stroke-width="2"/>
  <path d="M150 320 L420 320 L430 340 L140 340 Z" fill="#fff"/>
  <path d="M230 245 Q280 230 330 270" fill="none" stroke="#00F5A0" stroke-width="4"/>

  <g transform="translate(480, 85)">
